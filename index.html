<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="imageSection">
        <img src="pomodoro-technique.png">
        <h1>Pomodoro Timer</h1>
    </div><br>
    <div class="mainBox">
        <div class="timer">
            <div class="countDown" id="minuteClock">
                <h1 class="time">25</h1>
            </div>
            <h1 class="time">:</h1>
            <div class="countDown" id="secondsClock">
                <h1 class="time" id="secondsTime">00</h1>
            </div>
            <h1 class="time">min</h1>
        </div><br>
        <div class="buttons">
            <div>
                <button class="button">Start</button>
            </div><br>
            <div>
                <button class="button">Break</button>
            </div><br>
            <div>
                <button class="button">Reset</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
